# Local container run of the reference build.
#   cd deploy && DXP_TOKEN_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  dxp:
    build: ../backend
    image: dxp-backend:dev
    ports: ["8080:8080"]
    environment:
      DXP_TOKEN_SECRET: ${DXP_TOKEN_SECRET:?set DXP_TOKEN_SECRET}
      DXP_ALLOWED_ORIGINS: "http://localhost:8080"
    volumes: ["dxp-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true   # distroless has no shell; use the HTTP probes /health/live and /health/ready
    restart: unless-stopped
volumes:
  dxp-data: {}
