# Production shape for each stateless DXP service (identity, BFF, journey engine, transaction gateway,
# resolver, live channel, adapters). Not applied by default: the reference build is single-instance.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dxp-bff, namespace: dxp-app, labels: { app: dxp-bff } }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: dxp-bff } }
  template:
    metadata: { labels: { app: dxp-bff } }
    spec:
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: dxp-bff } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: dxp-bff } } }
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bff
          image: registry.bank.example/dxp/dxp-bff:GIT_SHA
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 } }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: dxp-bff, namespace: dxp-app }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: dxp-bff } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: dxp-bff, namespace: dxp-app }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dxp-bff }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
