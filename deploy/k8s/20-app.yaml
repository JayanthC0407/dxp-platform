apiVersion: v1
kind: ServiceAccount
metadata: { name: dxp-backend, namespace: dxp-app }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: dxp-data, namespace: dxp-app }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
# PROTOTYPE NOTE: replicas=1 + Recreate because the reference build keeps state in a JSON file and fans out
# SSE in-process. Production services are stateless (PostgreSQL + Redis pub/sub) and run 3+ replicas with
# RollingUpdate (maxUnavailable 0), topology spread, HPA and a PDB of minAvailable 2 - see 30-production-pattern.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxp-backend
  namespace: dxp-app
  labels: { app: dxp-backend }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dxp-backend } }
  template:
    metadata:
      labels: { app: dxp-backend }
    spec:
      serviceAccountName: dxp-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dxp
          image: registry.bank.example/dxp/dxp-backend:GIT_SHA   # signed image from the bank registry
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: DXP_DATA_DIR, value: /data }
            - { name: DXP_ALLOWED_ORIGINS, value: "https://dxp-console.bank.example" }
            - name: DXP_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: dxp-secrets, key: DXP_TOKEN_SECRET } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 2, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dxp-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: dxp-backend, namespace: dxp-app }
spec:
  selector: { app: dxp-backend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Default deny, then allow only the ingress controller in; egress only to DNS (adapters would add the
# egress gateway / ESB endpoints here).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: dxp-app }
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dxp-backend-allow, namespace: dxp-app }
spec:
  podSelector: { matchLabels: { app: dxp-backend } }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Customer App API ingress (behind the WAF / API gateway in the DMZ). SSE needs buffering off and long timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dxp-app-api
  namespace: dxp-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls: [{ hosts: ["api.bank.example"], secretName: dxp-app-tls }]
  rules:
    - host: api.bank.example
      http:
        paths:
          - { path: /api/app, pathType: Prefix, backend: { service: { name: dxp-backend, port: { number: 80 } } } }
---
# Console is published only on the intranet ingress class, never on the internet-facing one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dxp-console
  namespace: dxp-app
spec:
  ingressClassName: nginx-internal
  tls: [{ hosts: ["dxp-console.bank.example"], secretName: dxp-console-tls }]
  rules:
    - host: dxp-console.bank.example
      http:
        paths:
          - { path: /console, pathType: Prefix, backend: { service: { name: dxp-backend, port: { number: 80 } } } }
          - { path: /api/console, pathType: Prefix, backend: { service: { name: dxp-backend, port: { number: 80 } } } }
          - { path: /shared, pathType: Prefix, backend: { service: { name: dxp-backend, port: { number: 80 } } } }
