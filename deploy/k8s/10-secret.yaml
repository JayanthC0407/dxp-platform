# In production this Secret is created by the External Secrets Operator from Vault (blueprint 12.2 / 13.3).
# Example ExternalSecret (requires ESO + a ClusterSecretStore named "vault"):
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata: { name: dxp-secrets, namespace: dxp-app }
# spec:
#   refreshInterval: 1h
#   secretStoreRef: { kind: ClusterSecretStore, name: vault }
#   target: { name: dxp-secrets }
#   data:
#     - secretKey: DXP_TOKEN_SECRET
#       remoteRef: { key: dxp/app, property: token_secret }
#
# For a lab cluster only:  kubectl -n dxp-app create secret generic dxp-secrets --from-literal=DXP_TOKEN_SECRET=$(openssl rand -hex 32)
